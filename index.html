<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Musi Player</title>
    <!-- YouTube IFrame API – required for reliable auto-advance -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0d0f14;
        --surface: #161a22;
        --surf2: #1e2330;
        --border: #2a3045;
        --accent: #6c63ff;
        --accent2: #a78bfa;
        --text: #e2e8f0;
        --muted: #7c8ba1;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }

      /* ── app grid ── */
      .app {
        display: grid;
        grid-template-rows: 54px 1fr;
        grid-template-columns: 1fr 360px;
        height: 100vh;
      }

      /* ── topbar ── */
      .topbar {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 20px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .topbar .logo {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--accent2);
        white-space: nowrap;
      }
      .topbar-track {
        flex: 1;
        overflow: hidden;
        font-size: 0.82rem;
        color: var(--muted);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .topbar-track strong {
        color: var(--text);
      }

      /* ── player pane ── */
      .player-pane {
        display: flex;
        flex-direction: column;
        padding: 20px 24px 16px;
        gap: 14px;
        overflow: hidden;
        min-height: 0;
      }
      .now-playing {
        flex-shrink: 0;
      }
      .now-playing .song-title {
        font-size: 1.15rem;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .now-playing .song-artist {
        font-size: 0.82rem;
        color: var(--muted);
        margin-top: 2px;
      }
      .playlist-name-badge {
        display: inline-block;
        margin-top: 5px;
        font-size: 0.7rem;
        padding: 2px 10px;
        background: var(--surf2);
        border: 1px solid var(--border);
        border-radius: 20px;
        color: var(--accent2);
      }

      /* ── iframe / YT player ── */
      .iframe-wrapper {
        flex: 1 1 0;
        min-height: 0;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
        position: relative;
      }
      .iframe-wrapper > div,
      .iframe-wrapper iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
      .iframe-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: 12px;
        box-shadow: inset 0 0 0 1px rgba(108, 99, 255, 0.2);
      }

      /* ── controls ── */
      .controls {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .buttons-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .btn-ctrl {
        background: var(--surf2);
        border: 1px solid var(--border);
        border-radius: 50%;
        color: var(--text);
        cursor: pointer;
        font-size: 0.95rem;
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
      }
      .btn-ctrl:hover {
        background: var(--surface);
        border-color: var(--accent);
        color: var(--accent2);
      }
      .btn-ctrl.active {
        color: var(--accent2);
        border-color: var(--accent);
      }
      .btn-play {
        width: 52px;
        height: 52px;
        background: var(--accent);
        border-color: var(--accent);
        font-size: 1.2rem;
      }
      .btn-play:hover {
        background: var(--accent2);
        border-color: var(--accent2);
        color: #fff;
      }

      .volume-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .volume-row span {
        user-select: none;
      }
      input[type="range"] {
        -webkit-appearance: none;
        flex: 1;
        height: 4px;
        border-radius: 4px;
        background: var(--border);
        outline: none;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--accent2);
        cursor: pointer;
      }

      /* ── status bar ── */
      .status-bar {
        font-size: 0.75rem;
        color: var(--muted);
        text-align: center;
        min-height: 16px;
        flex-shrink: 0;
      }
      .status-bar .loading {
        color: var(--accent2);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .status-bar .error {
        color: #f87171;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }

      /* ── sidebar ── */
      .sidebar {
        background: var(--surface);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* tabs */
      .tab-bar {
        display: flex;
        flex-shrink: 0;
        border-bottom: 1px solid var(--border);
      }
      .tab {
        flex: 1;
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 12px 0;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .tab:hover {
        color: var(--text);
      }
      .tab.active {
        color: var(--accent2);
        border-bottom-color: var(--accent);
      }

      /* tab content */
      .tab-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .tab-content.hidden {
        display: none;
      }

      /* search */
      .search-box {
        padding: 10px 12px;
        flex-shrink: 0;
        border-bottom: 1px solid var(--border);
      }
      .search-box input {
        width: 100%;
        background: var(--surf2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        padding: 7px 12px;
        font-size: 0.82rem;
        outline: none;
        transition: border 0.2s;
      }
      .search-box input:focus {
        border-color: var(--accent);
      }

      /* song list */
      .song-list {
        flex: 1;
        overflow-y: auto;
        scroll-behavior: smooth;
      }
      .song-list::-webkit-scrollbar {
        width: 4px;
      }
      .song-list::-webkit-scrollbar-track {
        background: transparent;
      }
      .song-list::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      .song-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        cursor: pointer;
        position: relative;
        transition: background 0.1s;
      }
      .song-item:hover {
        background: var(--surf2);
      }
      .song-item.active {
        background: rgba(108, 99, 255, 0.12);
      }
      .song-item.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--accent);
        border-radius: 0 3px 3px 0;
      }
      .song-num {
        font-size: 0.72rem;
        color: var(--muted);
        min-width: 20px;
        text-align: right;
        flex-shrink: 0;
      }
      .song-item.active .song-num {
        color: var(--accent2);
      }
      .song-info {
        flex: 1;
        overflow: hidden;
      }
      .s-title {
        font-size: 0.84rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .song-item.active .s-title {
        color: var(--accent2);
      }
      .s-artist {
        font-size: 0.72rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .eq-icon {
        display: none;
        gap: 2px;
        align-items: flex-end;
        height: 14px;
        flex-shrink: 0;
      }
      .song-item.active .eq-icon {
        display: flex;
      }
      .eq-bar {
        width: 3px;
        background: var(--accent2);
        border-radius: 2px;
        animation: eq 0.7s ease-in-out infinite alternate;
      }
      .eq-bar:nth-child(1) {
        height: 7px;
        animation-delay: 0s;
      }
      .eq-bar:nth-child(2) {
        height: 13px;
        animation-delay: 0.2s;
      }
      .eq-bar:nth-child(3) {
        height: 9px;
        animation-delay: 0.4s;
      }
      @keyframes eq {
        from {
          transform: scaleY(0.35);
        }
        to {
          transform: scaleY(1);
        }
      }

      /* queue footer */
      .queue-footer {
        flex-shrink: 0;
        padding: 6px 14px;
        border-top: 1px solid var(--border);
        font-size: 0.72rem;
        color: var(--muted);
      }

      /* ── playlists tab ── */
      .add-pl-form {
        flex-shrink: 0;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        border-bottom: 1px solid var(--border);
      }
      .add-pl-form input {
        background: var(--surf2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        padding: 7px 10px;
        font-size: 0.8rem;
        outline: none;
        transition: border 0.2s;
        width: 100%;
      }
      .add-pl-form input:focus {
        border-color: var(--accent);
      }
      .add-pl-form button {
        background: var(--accent);
        border: none;
        border-radius: 8px;
        color: #fff;
        padding: 7px 0;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .add-pl-form button:hover {
        background: var(--accent2);
      }
      .add-pl-form button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .pl-status {
        font-size: 0.73rem;
        color: var(--muted);
        text-align: center;
        min-height: 14px;
        padding: 3px 0;
        flex-shrink: 0;
      }
      .pl-status .loading {
        color: var(--accent2);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .pl-status .error {
        color: #f87171;
      }
      .pl-status .ok {
        color: #4ade80;
      }

      .pl-header-row {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px 0;
      }
      .pl-header-row .pl-header-label {
        font-size: 0.72rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .btn-refresh-all {
        display: flex;
        align-items: center;
        gap: 5px;
        background: var(--surf2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        padding: 5px 10px;
        font-size: 0.72rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
      }
      .btn-refresh-all:hover {
        border-color: var(--accent);
        color: var(--accent2);
      }
      .btn-refresh-all:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .btn-refresh-all .icon {
        display: inline-block;
        transition: transform 0.6s linear;
      }
      .btn-refresh-all.spinning .icon {
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .playlist-cards {
        flex: 1;
        overflow-y: auto;
      }
      .playlist-cards::-webkit-scrollbar {
        width: 4px;
      }
      .playlist-cards::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      .pl-card {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        transition: background 0.1s;
      }
      .pl-card:hover {
        background: var(--surf2);
      }
      .pl-card-info {
        flex: 1;
        overflow: hidden;
        cursor: pointer;
      }
      .pl-card-name {
        font-size: 0.85rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pl-card-meta {
        font-size: 0.72rem;
        color: var(--muted);
        margin-top: 1px;
      }
      .pl-shuffle {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 0.85rem;
        padding: 4px 6px;
        border-radius: 6px;
        flex-shrink: 0;
        line-height: 1;
        opacity: 0.35;
        filter: grayscale(1);
        transition:
          opacity 0.15s,
          filter 0.15s,
          background 0.15s;
      }
      .pl-shuffle:hover {
        opacity: 0.7;
      }
      .pl-shuffle.on {
        opacity: 1;
        filter: none;
        background: rgba(167, 139, 250, 0.12);
      }
      .pl-refresh {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.9rem;
        padding: 4px 6px;
        border-radius: 6px;
        transition:
          color 0.15s,
          background 0.15s;
        flex-shrink: 0;
        line-height: 1;
      }
      .pl-refresh:hover {
        color: var(--accent2);
        background: rgba(167, 139, 250, 0.12);
      }
      .pl-refresh:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .pl-refresh.spinning {
        animation: spin 0.8s linear infinite;
        color: var(--accent2);
      }
      .pl-del {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.8rem;
        padding: 4px 6px;
        border-radius: 6px;
        transition:
          color 0.15s,
          background 0.15s;
        flex-shrink: 0;
      }
      .pl-del:hover {
        color: #f87171;
        background: rgba(248, 113, 113, 0.1);
      }
      .pl-empty {
        padding: 20px;
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
      }

      /* ── Playlist Preview Modal ── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.72);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
        animation: fadeIn 0.15s ease;
      }
      .modal-overlay.hidden {
        display: none;
      }
      .modal-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        width: 440px;
        max-width: calc(100vw - 32px);
        max-height: calc(100vh - 80px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .modal-header {
        padding: 16px 18px 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: flex-start;
        gap: 10px;
        flex-shrink: 0;
      }
      .modal-header-info {
        flex: 1;
        overflow: hidden;
      }
      .modal-title {
        font-size: 1rem;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .modal-meta {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 2px;
      }
      .modal-close {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 1rem;
        padding: 2px 7px;
        border-radius: 6px;
        flex-shrink: 0;
        transition:
          color 0.15s,
          background 0.15s;
      }
      .modal-close:hover {
        color: var(--text);
        background: var(--surf2);
      }
      .modal-songs {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
      }
      .modal-songs::-webkit-scrollbar {
        width: 4px;
      }
      .modal-songs::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
      .modal-song-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        border-bottom: 1px solid rgba(42, 48, 69, 0.5);
      }
      .modal-song-num {
        color: var(--muted);
        min-width: 22px;
        text-align: right;
        font-size: 0.72rem;
        flex-shrink: 0;
      }
      .modal-song-info {
        flex: 1;
        overflow: hidden;
      }
      .modal-song-title {
        font-size: 0.83rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .modal-song-artist {
        font-size: 0.7rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .modal-footer {
        padding: 12px 18px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex-shrink: 0;
      }
      .modal-now-playing-note {
        font-size: 0.73rem;
        color: var(--accent2);
        min-height: 0;
      }
      .modal-buttons {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      .btn-modal-cancel {
        background: var(--surf2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        padding: 8px 16px;
        font-size: 0.84rem;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-modal-cancel:hover {
        background: var(--border);
      }
      .btn-modal-play {
        background: var(--accent);
        border: none;
        border-radius: 8px;
        color: #fff;
        padding: 8px 20px;
        font-size: 0.84rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-modal-play:hover {
        background: var(--accent2);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- topbar -->
      <header class="topbar">
        <div class="logo">🎵 Musi Player</div>
        <div class="topbar-track" id="topbarTrack"></div>
      </header>

      <!-- player pane -->
      <main class="player-pane">
        <div class="now-playing">
          <div class="song-title" id="songTitle">
            Select a playlist to begin
          </div>
          <div class="song-artist" id="songArtist"></div>
          <div
            class="playlist-name-badge"
            id="playlistBadge"
            style="display: none"
          ></div>
        </div>

        <div class="iframe-wrapper">
          <div id="ytPlayer"></div>
          <div class="iframe-overlay"></div>
        </div>

        <div class="controls">
          <div class="buttons-row">
            <button
              class="btn-ctrl"
              id="btnShuffle"
              title="Shuffle (S)"
              onclick="toggleShuffle()"
            >
              🔀
            </button>
            <button class="btn-ctrl" title="Previous (←)" onclick="prevSong()">
              ⏮
            </button>
            <button
              class="btn-ctrl btn-play"
              id="btnPlay"
              title="Play/Pause (Space)"
              onclick="togglePlay()"
            >
              ⏸
            </button>
            <button class="btn-ctrl" title="Next (→)" onclick="nextSong()">
              ⏭
            </button>
            <button
              class="btn-ctrl"
              id="btnRepeat"
              title="Repeat (R)"
              onclick="toggleRepeat()"
            >
              🔁
            </button>
          </div>
          <div class="volume-row">
            <span>🔉</span>
            <input
              type="range"
              id="volSlider"
              min="0"
              max="100"
              value="80"
              oninput="setVolume(this.value)"
            />
            <span id="volVal">80%</span>
          </div>
        </div>
        <div class="status-bar" id="statusBar"></div>
      </main>

      <!-- sidebar -->
      <aside class="sidebar">
        <div class="tab-bar">
          <button
            class="tab"
            data-tab="queue"
            onclick="switchTab('queue')"
          >
            Queue
          </button>
          <button
            class="tab active"
            data-tab="playlists"
            onclick="switchTab('playlists')"
          >
            Playlists
          </button>
        </div>

        <!-- Queue tab -->
        <div class="tab-content hidden" id="tab-queue">
          <div class="search-box">
            <input
              type="search"
              id="searchInput"
              placeholder="🔍 Search songs…"
              oninput="filterQueue(this.value)"
            />
          </div>
          <div class="song-list" id="songList"></div>
          <div class="queue-footer" id="songCount"></div>
        </div>

        <!-- Playlists tab -->
        <div class="tab-content" id="tab-playlists">
          <div class="add-pl-form">
            <input
              type="text"
              id="newPlUrl"
              placeholder="feelthemusi.com/playlist/…"
            />
            <input type="text" id="newPlName" placeholder="Name (optional)" />
            <button id="btnAddPl" onclick="fetchAndSavePlaylist()">
              Fetch &amp; Save
            </button>
          </div>
          <div class="pl-status" id="plStatus"></div>
          <div class="pl-header-row">
            <span class="pl-header-label">Saved playlists</span>
            <button
              class="btn-refresh-all"
              id="btnRefreshAll"
              onclick="refreshAllPlaylists()"
              title="Re-fetch all playlists from feelthemusi"
            >
              <span class="icon">⟳</span> Refresh all
            </button>
          </div>
          <div class="playlist-cards" id="playlistCards"></div>
        </div>
      </aside>
    </div>

    <!-- Playlist Preview Modal -->
    <div class="modal-overlay hidden" id="plModal" onclick="closePlModal()">
      <div class="modal-box" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div class="modal-header-info">
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-meta" id="modalMeta"></div>
          </div>
          <button class="modal-close" onclick="closePlModal()">✕</button>
        </div>
        <div class="modal-songs" id="modalSongs"></div>
        <div class="modal-footer">
          <div class="modal-now-playing-note" id="modalNowPlayingNote"></div>
          <div class="modal-buttons">
            <button class="btn-modal-cancel" onclick="closePlModal()">
              Cancel
            </button>
            <button class="btn-modal-play" onclick="confirmPlayPlaylist()">
              ▶ Play Playlist
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ─────────────────────────────────────────────
      //  State
      // ─────────────────────────────────────────────
      let playlist = null; // loaded from saved playlists
      let currentIndex = 0;
      let isPlaying = false;
      let shuffle = false;
      let repeat = false;
      let shuffleOrder = [];
      let savedPlaylists = [];
      let player = null;
      let pendingVideoId = null;
      let previewPlIdx = null;

      // ─────────────────────────────────────────────
      //  YouTube IFrame API callback
      // ─────────────────────────────────────────────
      function onYouTubeIframeAPIReady() {
        player = new YT.Player("ytPlayer", {
          height: "100%",
          width: "100%",
          videoId: "",
          playerVars: { autoplay: 0, rel: 0, modestbranding: 1 },
          events: {
            onReady(e) {
              e.target.setVolume(parseInt($("volSlider").value));
              if (pendingVideoId) {
                e.target.loadVideoById(pendingVideoId);
                pendingVideoId = null;
              }
            },
            onStateChange(e) {
              if (e.data === YT.PlayerState.ENDED) {
                repeat ? playSongAt(currentIndex) : nextSong();
              } else if (e.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                $("btnPlay").textContent = "\u23F8";
              } else if (e.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                $("btnPlay").textContent = "\u25B6";
              }
            },
          },
        });
      }

      // ─────────────────────────────────────────────
      //  DOM helpers
      // ─────────────────────────────────────────────
      const $ = (id) => document.getElementById(id);

      function setStatus(msg, type = "") {
        $("statusBar").innerHTML = msg
          ? `<span class="${type}">${msg}</span>`
          : "";
      }
      function setPlStatus(msg, type = "") {
        $("plStatus").innerHTML = msg
          ? `<span class="${type}">${msg}</span>`
          : "";
      }
      function escHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // ─────────────────────────────────────────────
      //  Queue rendering & search
      // ─────────────────────────────────────────────
      function renderSidebar() {
        const list = $("songList");
        list.innerHTML = "";
        if (!playlist) {
          $("songCount").textContent = "No playlist loaded";
          return;
        }
        playlist.songs.forEach((s, i) => {
          const div = document.createElement("div");
          div.className = "song-item" + (i === currentIndex ? " active" : "");
          div.innerHTML = `
      <span class="song-num">${i + 1}</span>
      <div class="song-info">
        <div class="s-title">${escHtml(s.title)}</div>
        <div class="s-artist">${escHtml(s.artist)}</div>
      </div>
      <div class="eq-icon"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div>`;
          div.addEventListener("click", () => playSongAt(i));
          list.appendChild(div);
        });
        $("songCount").textContent = playlist.songs.length + " tracks";
        filterQueue($("searchInput").value);
      }

      function filterQueue(q) {
        const query = (q || "").toLowerCase();
        $("songList")
          .querySelectorAll(".song-item")
          .forEach((el) => {
            const t = el.querySelector(".s-title").textContent.toLowerCase();
            const a = el.querySelector(".s-artist").textContent.toLowerCase();
            el.style.display =
              !query || t.includes(query) || a.includes(query) ? "" : "none";
          });
      }

      function scrollToActive() {
        const el = $("songList").querySelector(".song-item.active");
        if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }

      // ─────────────────────────────────────────────
      //  Player logic
      // ─────────────────────────────────────────────
      function playSongAt(index) {
        currentIndex = index;
        const song = playlist.songs[currentIndex];
        $("songTitle").textContent = song.title;
        $("songArtist").textContent = song.artist;
        const badge = $("playlistBadge");
        badge.textContent = playlist.name;
        badge.style.display = "";
        $("topbarTrack").innerHTML =
          `<strong>${escHtml(song.title)}</strong> &mdash; ${escHtml(song.artist)}`;

        if (player && player.loadVideoById) {
          player.loadVideoById(song.id);
        } else {
          pendingVideoId = song.id;
        }
        isPlaying = true;
        $("btnPlay").textContent = "\u23F8";
        document
          .querySelectorAll(".song-item")
          .forEach((el, i) =>
            el.classList.toggle("active", i === currentIndex),
          );
        scrollToActive();
        setStatus("");
      }

      function togglePlay() {
        if (!player) return;
        player.getPlayerState() === YT.PlayerState.PLAYING
          ? player.pauseVideo()
          : player.playVideo();
      }

      function prevSong() {
        playSongAt(getAdjacentIndex(-1));
      }
      function nextSong() {
        playSongAt(getAdjacentIndex(1));
      }

      function getAdjacentIndex(dir) {
        if (shuffle) {
          if (!shuffleOrder.length) buildShuffleOrder();
          const pos = shuffleOrder.indexOf(currentIndex);
          return shuffleOrder[
            (pos + dir + shuffleOrder.length) % shuffleOrder.length
          ];
        }
        return (
          (currentIndex + dir + playlist.songs.length) % playlist.songs.length
        );
      }

      function buildShuffleOrder() {
        shuffleOrder = playlist.songs.map((_, i) => i);
        for (let i = shuffleOrder.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffleOrder[i], shuffleOrder[j]] = [
            shuffleOrder[j],
            shuffleOrder[i],
          ];
        }
      }

      // Playlists shuffle on load unless their card toggle turned it off.
      // Call after `playlist` is set; returns the index to start from.
      function applyPlaylistShuffle(pl) {
        shuffle = pl.shuffleDefault !== false;
        shuffleOrder = [];
        $("btnShuffle").classList.toggle("active", shuffle);
        if (!shuffle) return 0;
        buildShuffleOrder();
        return shuffleOrder[0] ?? 0;
      }

      function toggleShuffle() {
        shuffle = !shuffle;
        shuffleOrder = [];
        $("btnShuffle").classList.toggle("active", shuffle);
      }
      function toggleRepeat() {
        repeat = !repeat;
        $("btnRepeat").classList.toggle("active", repeat);
      }
      function setVolume(val) {
        $("volVal").textContent = val + "%";
        if (player && player.setVolume) player.setVolume(parseInt(val));
      }

      // ─────────────────────────────────────────────
      //  Tab switching
      // ─────────────────────────────────────────────
      function switchTab(tab) {
        document
          .querySelectorAll(".tab")
          .forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
        document
          .querySelectorAll(".tab-content")
          .forEach((c) => c.classList.add("hidden"));
        $("tab-" + tab).classList.remove("hidden");
      }

      // ─────────────────────────────────────────────
      //  Saved playlists — server‑backed JSON
      // ─────────────────────────────────────────────
      async function loadSavedPlaylists() {
        try {
          const resp = await fetch("/api/playlists");
          if (!resp.ok) throw new Error();
          savedPlaylists = await resp.json();
        } catch {
          savedPlaylists = [];
        }
        renderPlaylistCards();
        await loadState();
      }

      async function loadState() {
        try {
          const resp = await fetch("/api/state");
          if (!resp.ok) return;
          const state = await resp.json();
          if (state.lastPlaylistId && savedPlaylists.length) {
            const idx = savedPlaylists.findIndex(
              (p) => p.id === state.lastPlaylistId,
            );
            if (idx > -1) {
              playlist = JSON.parse(JSON.stringify(savedPlaylists[idx]));
              currentIndex = applyPlaylistShuffle(playlist);
              renderSidebar();
              // Show track info but do NOT start playback
              const song = playlist.songs[currentIndex];
              $("songTitle").textContent = song.title;
              $("songArtist").textContent = song.artist;
              $("playlistBadge").textContent = playlist.name;
              $("playlistBadge").style.display = "";
              $("topbarTrack").innerHTML =
                `<strong>${escHtml(song.title)}</strong> &mdash; ${escHtml(song.artist)}`;
              $("btnPlay").textContent = "\u25B6";
              isPlaying = false;
            }
          }
        } catch {}
      }

      async function saveState(playlistId) {
        try {
          await fetch("/api/state", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ lastPlaylistId: playlistId }),
          });
        } catch {}
      }

      async function persistPlaylists() {
        await fetch("/api/playlists", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(savedPlaylists),
        });
      }

      function renderPlaylistCards() {
        const c = $("playlistCards");
        if (!savedPlaylists.length) {
          c.innerHTML =
            '<div class="pl-empty">No saved playlists yet.<br>Add one above.</div>';
          return;
        }
        c.innerHTML = "";
        savedPlaylists.forEach((pl, idx) => {
          const shuffleOn = pl.shuffleDefault !== false;
          const card = document.createElement("div");
          card.className = "pl-card";
          card.innerHTML = `
      <div class="pl-card-info">
        <div class="pl-card-name">${escHtml(pl.name)}</div>
        <div class="pl-card-meta">${pl.songs.length} tracks</div>
      </div>
      <button class="pl-shuffle${shuffleOn ? " on" : ""}" title="Shuffle by default: ${shuffleOn ? "on" : "off"}">🔀</button>
      <button class="pl-refresh" title="Refetch this playlist">⟳</button>
      <button class="pl-del" title="Remove">✕</button>`;
          card
            .querySelector(".pl-card-info")
            .addEventListener("click", () => openPlModal(idx));
          card.querySelector(".pl-shuffle").addEventListener("click", (e) => {
            e.stopPropagation();
            toggleShuffleDefault(idx);
          });
          card.querySelector(".pl-refresh").addEventListener("click", (e) => {
            e.stopPropagation();
            refreshSinglePlaylist(idx, e.currentTarget);
          });
          card.querySelector(".pl-del").addEventListener("click", (e) => {
            e.stopPropagation();
            deletePlaylist(idx);
          });
          c.appendChild(card);
        });
      }

      function openPlModal(idx) {
        previewPlIdx = idx;
        const pl = savedPlaylists[idx];
        $("modalTitle").textContent = pl.name;
        $("modalMeta").textContent = pl.songs.length + " tracks";

        const container = $("modalSongs");
        container.innerHTML = "";
        pl.songs.forEach((s, i) => {
          const div = document.createElement("div");
          div.className = "modal-song-item";
          div.innerHTML = `
            <span class="modal-song-num">${i + 1}</span>
            <div class="modal-song-info">
              <div class="modal-song-title">${escHtml(s.title)}</div>
              <div class="modal-song-artist">${escHtml(s.artist)}</div>
            </div>`;
          container.appendChild(div);
        });

        const note = $("modalNowPlayingNote");
        if (playlist && isPlaying) {
          note.textContent = "▶ Now playing: " + playlist.name;
        } else if (playlist) {
          note.textContent = "⏸ Loaded: " + playlist.name;
        } else {
          note.textContent = "";
        }

        $("plModal").classList.remove("hidden");
      }

      function closePlModal() {
        $("plModal").classList.add("hidden");
        previewPlIdx = null;
      }

      function confirmPlayPlaylist() {
        if (previewPlIdx === null) return;
        loadSavedPlaylist(previewPlIdx);
        closePlModal();
      }

      function loadSavedPlaylist(idx) {
        playlist = JSON.parse(JSON.stringify(savedPlaylists[idx]));
        currentIndex = applyPlaylistShuffle(playlist);
        renderSidebar();
        playSongAt(currentIndex);
        switchTab("queue");
        saveState(savedPlaylists[idx].id);
      }

      // Missing shuffleDefault means on, so the first toggle stores false.
      async function toggleShuffleDefault(idx) {
        const pl = savedPlaylists[idx];
        pl.shuffleDefault = pl.shuffleDefault === false;
        renderPlaylistCards();
        await persistPlaylists();
      }

      async function deletePlaylist(idx) {
        savedPlaylists.splice(idx, 1);
        await persistPlaylists();
        renderPlaylistCards();
      }

      // Parse the Musi API JSON response (handles direct or proxy-wrapped)
      function parseMusiApiResponse(raw) {
        // raw may be: already-parsed object, or a JSON string
        const obj = typeof raw === "string" ? JSON.parse(raw) : raw;
        const success = obj.success;
        if (!success) return null;
        const inner =
          typeof success.data === "string"
            ? JSON.parse(success.data)
            : success.data;
        const tracks = inner.data;
        if (!Array.isArray(tracks) || !tracks.length) return null;
        return {
          title: success.title || inner.title || "",
          songs: tracks.map((t) => ({
            title: t.video_name,
            artist: t.video_creator,
            id: t.video_id,
          })),
        };
      }

      async function refreshAllPlaylists() {
        if (!savedPlaylists.length) {
          setPlStatus("No saved playlists to refresh.", "error");
          return;
        }
        const btn = $("btnRefreshAll");
        btn.disabled = true;
        btn.classList.add("spinning");
        setPlStatus("Refreshing all playlists\u2026", "loading");
        try {
          const resp = await fetch("/api/refresh");
          if (!resp.ok) throw new Error();
          savedPlaylists = await resp.json();
          renderPlaylistCards();
          syncActivePlaylistFrom(savedPlaylists);
          setPlStatus("\u2713 Playlists refreshed", "ok");
        } catch {
          setPlStatus(
            "Refresh failed \u2014 check the server console.",
            "error",
          );
        }
        btn.disabled = false;
        btn.classList.remove("spinning");
      }

      async function refreshSinglePlaylist(idx, btnEl) {
        const pl = savedPlaylists[idx];
        if (!pl) return;
        btnEl.disabled = true;
        btnEl.classList.add("spinning");
        setPlStatus(`Refreshing "${escHtml(pl.name)}"\u2026`, "loading");
        try {
          const resp = await fetch(
            `/api/refresh?id=${encodeURIComponent(pl.id)}`,
          );
          if (!resp.ok) throw new Error();
          const updated = await resp.json();
          savedPlaylists[idx] = updated;
          syncActivePlaylistFrom(savedPlaylists);
          setPlStatus(
            `\u2713 "${escHtml(updated.name)}" refreshed \u2014 ${updated.songs.length} tracks`,
            "ok",
          );
        } catch {
          setPlStatus(`Failed to refresh "${escHtml(pl.name)}".`, "error");
          btnEl.disabled = false;
          btnEl.classList.remove("spinning");
          return;
        }
        renderPlaylistCards();
      }

      // If the playlist currently loaded in the Queue was just refreshed,
      // update it in place (keeping playback position on the same track
      // where possible) so newly added songs show up immediately.
      function syncActivePlaylistFrom(freshList) {
        if (!playlist) return;
        const updated = freshList.find((p) => p.id === playlist.id);
        if (!updated) return;
        const prevSongId = playlist.songs[currentIndex]
          ? playlist.songs[currentIndex].id
          : null;
        playlist = JSON.parse(JSON.stringify(updated));
        shuffleOrder = []; // old order indexes the old song list
        const newIdx = prevSongId
          ? playlist.songs.findIndex((s) => s.id === prevSongId)
          : -1;
        currentIndex =
          newIdx > -1
            ? newIdx
            : Math.min(currentIndex, Math.max(playlist.songs.length - 1, 0));
        renderSidebar();
      }

      async function fetchAndSavePlaylist() {
        const rawUrl = $("newPlUrl").value.trim();
        if (!rawUrl || !rawUrl.includes("feelthemusi.com/playlist/")) {
          setPlStatus(
            "\u26A0 Enter a valid feelthemusi.com/playlist/\u2026 URL",
            "error",
          );
          return;
        }
        const btn = $("btnAddPl");
        btn.disabled = true;
        setPlStatus("Fetching playlist\u2026", "loading");
        try {
          const urlId = rawUrl.split("/").pop();
          const apiUrl = `https://feelthemusi.com/api/v4/playlists/fetch/${urlId}`;

          // Strategies: direct fetch, then two CORS proxies
          const strategies = [
            () =>
              fetch(apiUrl).then((r) => (r.ok ? r.json() : Promise.reject())),
            () =>
              fetch(
                `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`,
              ).then((r) =>
                r.ok ? r.json().then((j) => j.contents) : Promise.reject(),
              ),
            () =>
              fetch(`https://corsproxy.io/?${encodeURIComponent(apiUrl)}`).then(
                (r) => (r.ok ? r.json() : Promise.reject()),
              ),
          ];

          let result = null;
          for (const strategy of strategies) {
            try {
              const raw = await strategy();
              result = parseMusiApiResponse(raw);
              if (result) break;
            } catch {
              // try next strategy
            }
          }

          if (!result) {
            setPlStatus("No songs found \u2014 check the URL.", "error");
            btn.disabled = false;
            return;
          }

          const name = $("newPlName").value.trim() || result.title || rawUrl;
          const pl = { id: urlId, name, url: rawUrl, songs: result.songs };
          const existIdx = savedPlaylists.findIndex((p) => p.id === urlId);
          if (existIdx > -1) {
            pl.shuffleDefault = savedPlaylists[existIdx].shuffleDefault;
            savedPlaylists[existIdx] = pl;
          } else {
            savedPlaylists.push(pl);
          }
          await persistPlaylists();
          renderPlaylistCards();
          $("newPlUrl").value = "";
          $("newPlName").value = "";
          setPlStatus(`\u2713 Saved "${name}"`, "ok");
        } catch {
          setPlStatus("Failed \u2014 check URL and try again.", "error");
        }
        btn.disabled = false;
      }

      // ─────────────────────────────────────────────
      //  Keyboard shortcuts
      // ─────────────────────────────────────────────
      document.addEventListener("keydown", (e) => {
        if (e.code === "Escape") closePlModal();
        if (["INPUT", "TEXTAREA"].includes(e.target.tagName)) return;
        if (e.code === "Space") {
          e.preventDefault();
          togglePlay();
        }
        if (e.code === "ArrowRight") nextSong();
        if (e.code === "ArrowLeft") prevSong();
        if (e.code === "KeyS") toggleShuffle();
        if (e.code === "KeyR") toggleRepeat();
      });
      $("newPlUrl").addEventListener("keydown", (e) => {
        if (e.key === "Enter") fetchAndSavePlaylist();
      });

      // ─────────────────────────────────────────────
      //  Init
      // ─────────────────────────────────────────────
      renderSidebar(); // shows empty state until playlists load
      loadSavedPlaylists();
    </script>
  </body>
</html>
